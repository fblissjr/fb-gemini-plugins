<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- 10% margin frame: content within 14..114 -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  <!-- Three converging rival vectors / nodes around a central Crux diamond -->
  <!-- Top Rival Node (Cyan) -->
  <circle cx="64" cy="32" r="9" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-width="3.5"/>
  <line x1="64" y1="41" x2="64" y2="54" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom-Left Rival Node (Amber) -->
  <circle cx="36" cy="86" r="9" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" stroke-width="3.5"/>
  <line x1="43" y1="80" x2="55" y2="71" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom-Right Rival Node (Rose) -->
  <circle cx="92" cy="86" r="9" fill="#F43F5E" fill-opacity="0.25" stroke="#FB7185" stroke-width="3.5"/>
  <line x1="85" y1="80" x2="73" y2="71" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
  <!-- Connecting Arena Ring -->
  <path d="M51 35C36 41 28 57 32 73" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M77 35C92 41 100 57 96 73" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M49 91C59 95 69 95 79 91" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- Central Crux Diamond -->
  <polygon points="64,53 75,64 64,75 53,64" fill="#A855F7" fill-opacity="0.3" stroke="#C084FC" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="2.5" fill="#F8FAFC"/>
</svg>
